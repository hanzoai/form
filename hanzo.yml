# CI/CD for hanzoai/form, read by the hanzoai/ci reusable (.github/workflows/cicd.yml)
# and by platform.hanzo.ai. A Go module embedded by hanzo-inc/cloud: it ships from a
# tag and builds no image.

test:
  - name: build
    run: go build ./...
  - name: vet
    run: go vet ./...
  - name: test
    run: go test -count=1 ./...
  # cmd/form is its own module (it reads commerce's store through commerce's
  # packages), so the root ./... does not reach it.
  - name: importer
    run: cd cmd/form && CGO_ENABLED=0 go vet ./... && CGO_ENABLED=0 go test -count=1 ./...
